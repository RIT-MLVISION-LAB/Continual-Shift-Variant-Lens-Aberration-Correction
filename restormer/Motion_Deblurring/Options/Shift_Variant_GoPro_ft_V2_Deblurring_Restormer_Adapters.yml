## Shift-Variant Blur Deblurring for Star Phase Mask Variant 2 with GoPro Deblurring Pretraining and Adapters
# general settings
name: Shift_Variant_GoPro_ft_V2_Deblurring_Restormer_Adapters
model_type: RestormerAdapterModel
scale: 1
num_gpu: 4 # set to 0 for cpu mode, adjust based on available GPUs
manual_seed: 100

# adapter settings
adapter_training: true

# dataset and data loader settings
datasets:
  train:
    name: TrainSet_ShiftVariant_GoPro_ft_V2_Adapters
    type: Dataset_PairedImage
    dataroot_gt: ./Motion_Deblurring/Datasets/train/ShiftVariant_V2/target_crops
    dataroot_lq: ./Motion_Deblurring/Datasets/train/ShiftVariant_V2/input_crops
    geometric_augs: true

    filename_tmpl: "{}"
    io_backend:
      type: disk

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8

    ### -------------Progressive training--------------------------
    # mini_batch_sizes: [8,5,4,2,1,1]  # Batch size per gpu (for single GPU training, use smaller batch sizes: [4,3,2,1,1,1])
    # iters: [92000,64000,48000,36000,36000,24000]
    # gt_size: 384   # Max patch size for progressive training
    # gt_sizes: [128,160,192,256,320,384]  # Patch sizes for progressive training.
    ### ------------------------------------------------------------

    ### ------- Training on single fixed-patch size 128x128---------
    mini_batch_sizes: [8]
    iters: [50000]
    gt_size: 128
    gt_sizes: [128]
    ### ------------------------------------------------------------

    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: ValSet_ShiftVariant_GoPro_ft_V2_Adapters
    type: Dataset_PairedImage
    dataroot_gt: ./Motion_Deblurring/Datasets/val/ShiftVariant_V2/target_crops
    dataroot_lq: ./Motion_Deblurring/Datasets/val/ShiftVariant_V2/input_crops
    io_backend:
      type: disk

# network structures
network_g:
  type: RestormerAdapters
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: False
  LayerNorm_type: WithBias
  # adapter configuration
  adapter_config:
    bottleneck: 64
    dropout: 0.1
    adapter_scalar: "1.0"
    adapter_layernorm_option: in
    adapter_option: parallel
    adapter_momentum: 0.0

# path
path:
  pretrain_network_g: ./Motion_Deblurring/pretrained_models/motion_deblurring.pth
  strict_load_g: false # allows loading checkpoints with missing keys (extra adapter params randomly initialized)
  resume_state: ~

# training settings
train:
  total_iter: 50000
  warmup_iter: -1 # no warm up
  use_grad_clip: true

  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [50000]
    restart_weights: [1]
    eta_mins: [0.000001]

  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true

  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  window_size: 8
  val_freq: !!float 2e3
  save_img: false
  rgb2bgr: true
  use_image: true
  max_minibatch: 8

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
